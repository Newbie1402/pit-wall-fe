name: PitWall
options:
  bundleIdPrefix: com.pitwallapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  PitWall:
    type: application
    platform: iOS
    sources:
      - path: PitWall
      - path: PitWallKit
    dependencies:
      - target: PitWallWidgets
        embed: true
        codeSign: true
    info:
      path: PitWall/Resources/Info.plist
      properties:
        CFBundleDisplayName: PitWall
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsFullAccessUsageDescription: PitWall uses your calendar to add race sessions so you never miss a session.
        NSCalendarsWriteOnlyAccessUsageDescription: PitWall adds race sessions to your calendar so you never miss a session.
        CFBundleURLTypes:
          - CFBundleURLName: com.pitwallapp.deeplink
            CFBundleURLSchemes:
              - pitwall
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: PitWall/Resources/PitWall.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pitwallapp.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitwallapp.mobile
        PRODUCT_NAME: PitWall
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PitWallWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PitWallWidgets
      - path: PitWallKit
    info:
      path: PitWallWidgets/Info.plist
      properties:
        CFBundleDisplayName: PitWall Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PitWallWidgets/PitWallWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pitwallapp.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitwallapp.mobile.widgets
        SKIP_INSTALL: YES

  PitWallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PitWallTests
    dependencies:
      - target: PitWall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitwallapp.mobile.tests

  PitWallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PitWallUITests
    dependencies:
      - target: PitWall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitwallapp.mobile.uitests
        TEST_TARGET_NAME: PitWall

schemes:
  PitWall:
    build:
      targets:
        PitWall: all
        PitWallWidgets: all
        PitWallTests: [test]
        PitWallUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PitWallTests
        - PitWallUITests
